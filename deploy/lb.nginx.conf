events {}

http {
  # Docker DNS returns every replica of api-replica, and nginx round-robins across them.
  # shortcut: addresses are resolved once at start, so restart the LB after scaling;
  # use a real load balancer or service discovery in production.
  upstream api {
    server api-replica:8080;
  }

  server {
    listen 80;
    add_header X-Riz-Replica $upstream_addr always;
    location / {
      proxy_pass http://api;
    }
  }
}
