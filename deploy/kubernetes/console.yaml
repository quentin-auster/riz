# riz console. It keeps sessions in memory (docs/decisions/0006-console-session.md), so it runs
# as ONE replica: a second would not know the first's sessions. shortcut: one replica and no
# PodDisruptionBudget; move sessions to shared storage before scaling it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: riz-console
  namespace: riz
data:
  PORT: "3000"
  RIZ_API_URL: http://riz-api.riz.svc.cluster.local
  # Replace with your identity provider and the console's public address.
  OIDC_ISSUER: https://idp.example.invalid/
  OIDC_CLIENT_ID: riz-console
  OIDC_REDIRECT_URI: https://riz-console.example.invalid/auth/callback
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: riz-console
  namespace: riz
  labels:
    app.kubernetes.io/name: riz-console
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: riz-console
  template:
    metadata:
      labels:
        app.kubernetes.io/name: riz-console
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: console
          # Build and publish this image yourself (deploy/console.Dockerfile).
          image: riz-console:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: riz-console
          env:
            # Optional: only a confidential OIDC client has one.
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: riz-console
                  key: oidc-client-secret
                  optional: true
          # The console has no health route, so probes check that it accepts connections.
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: riz-console
  namespace: riz
spec:
  selector:
    app.kubernetes.io/name: riz-console
  ports:
    - name: http
      port: 80
      targetPort: http
