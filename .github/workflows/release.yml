name: release

# Pushing a vX.Y.Z tag builds, signs, and publishes the API and console images.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read
  packages: write
  id-token: write # keyless cosign signing

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [api, console]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # A tag on any other branch would publish and sign an unreviewed image.
      - run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      # ghcr.io names must be lowercase.
      - run: echo "REPO=ghcr.io/${OWNER,,}/riz-${{ matrix.image }}" >> "$GITHUB_ENV"
        env:
          OWNER: ${{ github.repository_owner }}
      # Fixed timestamps: the same commit builds the same layers.
      - run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REPO }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/${{ matrix.image }}.Dockerfile
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
          outputs: type=image,push=true,rewrite-timestamp=true
          sbom: true
          provenance: mode=max
      - uses: sigstore/cosign-installer@v3
      - run: cosign sign --yes "$REPO@${{ steps.build.outputs.digest }}"
