name: ci

on:
  push:
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      RIZ_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres
      OPENFGA_API_URL: http://localhost:8081
    steps:
      - uses: actions/checkout@v5
      # In-memory datastore: enough for API integration tests, nothing persists.
      - run: docker run -d -p 8081:8080 openfga/openfga:v1.10.2 run
      - run: curl -sf --retry 30 --retry-all-errors --retry-delay 1 http://localhost:8081/healthz
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # .env.example holds placeholder dev values only.
      - run: cp .env.example .env
      - run: docker compose --env-file .env -f deploy/compose.yaml up -d --build --wait api
      - run: curl -sf --retry 30 --retry-all-errors --retry-delay 1 http://localhost:8081/healthz
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @riz/api test:integration
        env:
          RIZ_API_URL: http://localhost:8080
          OPENFGA_API_URL: http://localhost:8081
      - run: pnpm --filter @riz/sdk test:integration
        env:
          RIZ_API_URL: http://localhost:8080
          OPENFGA_API_URL: http://localhost:8081
      - if: failure()
        run: docker compose --env-file .env -f deploy/compose.yaml logs --tail 50 api openfga

  replicas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: cp .env.example .env
      - run: docker compose --env-file .env -f deploy/compose.yaml --profile replicas up -d --build --wait lb
      - run: curl -sf --retry 30 --retry-all-errors --retry-delay 1 http://localhost:8090/health/ready
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @riz/api test:replicas
        env:
          RIZ_LB_URL: http://localhost:8090
          RIZ_REPLICAS: "2"
      - if: failure()
        run: docker compose --env-file .env -f deploy/compose.yaml --profile replicas logs --tail 50 api-replica lb

  kubernetes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker run --rm -v "$PWD/deploy/kubernetes:/manifests:ro" ghcr.io/yannh/kubeconform:v0.6.7 -strict -summary -kubernetes-version 1.31.0 /manifests

  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: make model-test

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run mypy sdks/python/src
      - run: uv run pytest sdks/python tests/conformance/databricks
